# Copy one of examples/config.*.toml to config.toml (gitignored) and fill in [kaggle].username.

[kaggle]
username = "your-kaggle-username"
# 2x Tesla T4 (2 x 15 GB usable). "NvidiaTeslaP100" = 1x 16 GB, faster per card but single GPU.
accelerator = "NvidiaTeslaT4"
# llama.cpp stable release compiled by `kis build`; Renovate checks for new ones weekly.
# renovate: datasource=github-releases depName=ggml-org/llama.cpp
llama_cpp_ref = "v0.6.0"

[tunnel]
# How the Kaggle server is reached:
# "cloudflared" without token: Quick Tunnel, no account, random *.trycloudflare.com URL per
#   session (`kis proxy` follows it). Cloudflare documents no SSE support and a 200
#   in-flight request cap for Quick Tunnels.
# "cloudflared" with token: named tunnel with a stable hostname on your Cloudflare domain;
#   in the dashboard, point its public hostname to http://localhost:8080.
# "tailscale": private tailnet hostname, needs a reusable + ephemeral auth key
#   (https://login.tailscale.com/admin/settings/keys) and Tailscale on this machine.
kind = "cloudflared"
token = ""        # cloudflared named tunnel token
public_url = ""   # e.g. "https://llm.example.com" (named tunnel)
authkey = ""      # tailscale auth key
hostname = "kaggle-llm"

[ntfy]
# Server for kis' event topic (private, random, in .kis/secrets.json): ntfy.sh or self-hosted.
# A token (or KIS_NTFY_TOKEN) is for servers that require login.
server = "https://ntfy.sh"
token = ""

[notify]
# Optional phone/desktop notifications (ntfy app): model ready, stopped, failed, out-of-memory
# retries. Never the endpoint or keys. kis' own control topic stays private and random.
# Posted to the [ntfy] server (with its token) unless `server` is set here.
# A token (or KIS_NOTIFY_TOKEN) is for access-protected topics.
topic = ""
token = ""

[server]
# The kernel exits on its own (saving GPU quota) after this much inactivity / total time.
idle_minutes = 10  # restarting takes ~1 min (small models) to ~4 min (27B)
max_hours = 11.5   # Kaggle ends a session after 12 h; also capped at 2 min before the GPU quota runs out
# `kis proxy` replaces a session this old with a fresh one, without downtime (0 = off).
rollover_hours = 11.0
# Requests that may wait beyond the slots before the server answers 429 (Retry-After: 5).
# Unset = no limit (llama-server queues them).
# max_queue = 8
# Replicate the model on each GPU when its files are at most this size; otherwise
# split one instance across both GPUs. Per-model `topology` overrides it.
replica_max_gb = 11.0
# Context per slot in tokens (default; per-model `ctx` overrides it). Each slot is
# guaranteed this much: the KV cache holds parallel x ctx tokens. If it doesn't fit,
# the server starts with fewer slots instead of less context.
ctx = 32768
# A request whose `model` names another preset (by name or alias) swaps the session to
# it: requests in flight finish, new ones wait while it loads. Requests without a known
# model name go to the loaded preset. false = only `kis use` swaps.
autoload = true
# Presets to download in the background once the server is ready, so swapping to them
# only loads them (each takes disk space on the kernel for the session).
prefetch = []
# Presets served on GPU 0 for the whole session beside the swapped one and never
# swapped out, e.g. an embedding model for RAG.
resident = []
# Arguments for every model; per-model `args` are appended.
args = [
  "--n-gpu-layers", "999",
  "--flash-attn", "auto",
  "--cache-type-k", "f16",
  "--cache-type-v", "f16",
  "--reasoning", "on",
  "--reasoning-budget", "4096",
  "--batch-size", "2048",
  "--ubatch-size", "512",
  # Host RAM (MiB) each llama-server may use for its prompt cache. Kaggle gives ~30 GiB of RAM
  # and 2 replicas run at once. llama.cpp's default of 8192 filled it: the kernel killed a
  # server after 25-50 min of load. Measured with 32 slots on gemma-4-e4b: 3072 held 22 GiB
  # for 68 min, 4096 reached 28.6 GiB after 71 min. Each GiB here costs about 2 GiB of RAM.
  "--cache-ram", "3072",
  # Context checkpoints per slot (llama.cpp default 32), also kept in host RAM: 8 cut each server's
  # memory by about 2 GiB (9.8 to 7.0) with the same cache hit rate and speed. Both options are
  # also the kis default; an embedding model gets --cache-ram 0 unless its args say otherwise.
  "--ctx-checkpoints", "8",
  "--metrics",
]

# ---------------------------------------------------------------------------
# Model presets, profile 96k: 96K tokens of context per slot, as many slots as fit.
# Measured on Kaggle's 2x T4 with `kis calibrate`; `kis calibrate --write` regenerates
# this file. `parallel` = slots per llama-server instance (2 replicas -> 2x slots),
# `ctx` = context each slot is guaranteed. KV cache in f16 (no quality loss).
# `alias` is the model name the API reports. Sampling follows each model card.
# ---------------------------------------------------------------------------

