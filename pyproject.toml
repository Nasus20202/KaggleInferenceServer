[project]
name = "kis"
version = "0.1.0"
description = "llama.cpp on free Kaggle GPUs behind a local OpenAI-compatible endpoint"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "kaggle>=1.7"]

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.1", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[project.scripts]
kis = "kis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
