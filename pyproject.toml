[project]
name = "kis"
version = "1.3.0"
description = "llama.cpp on free Kaggle GPUs behind a local OpenAI-compatible endpoint"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "kaggle>=1.7"]

[dependency-groups]
dev = ["pyright[nodejs]>=1.1.400", "pytest>=8", "pytest-aiohttp>=1.1", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]  # Any is fine for parsed JSON

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["kis", "common", "backends", "balancer", "state", "tunnels"]

[tool.pyright]
include = ["kis", "kaggle", "tests"]
extraPaths = ["kaggle"]  # the Kaggle scripts import kaggle/common.py
pythonVersion = "3.11"
typeCheckingMode = "standard"

[project.scripts]
kis = "kis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
